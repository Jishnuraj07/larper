<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <!-- One mask, every costume: gold, magenta and cyan run across it. -->
    <linearGradient id="mask" x1="0" y1="0" x2="1" y2="0.35">
      <stop offset="0" stop-color="#F2C14E"/>
      <stop offset="0.5" stop-color="#FF3EC8"/>
      <stop offset="1" stop-color="#00D8FF"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1C1830"/>
      <stop offset="1" stop-color="#0E0C16"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <rect x="10" y="10" width="492" height="492" rx="96" fill="none" stroke="#FFFFFF" stroke-opacity="0.08" stroke-width="4"/>
  <!-- the mask, with its eyes cut out of it -->
  <path fill="url(#mask)" fill-rule="evenodd" d="
    M256 206 C302 166 386 150 448 176 C456 252 418 340 332 352 C296 357 272 334 256 310 C240 334 216 357 180 352 C94 340 56 252 64 176 C126 150 210 166 256 206 Z
    M136 252 C150 226 196 220 222 240 C212 270 172 282 136 252 Z
    M376 252 C362 226 316 220 290 240 C300 270 340 282 376 252 Z"/>
  <!-- a sheen along the brow -->
  <path d="M96 190 C150 176 212 186 252 220" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="8" stroke-linecap="round"/>
  <!-- the stick it is held up by -->
  <path d="M410 330 L452 430" stroke="url(#mask)" stroke-width="18" stroke-linecap="round"/>
</svg>
