<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1E2550"/>
      <stop offset="1" stop-color="#0B0E22"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE08A"/>
      <stop offset="1" stop-color="#F2A23A"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF4CC"/>
      <stop offset="1" stop-color="#FFC95A"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFC95A" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFC95A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- night-blue tile with a warm glow behind the die -->
  <rect width="512" height="512" rx="104" fill="url(#tile)"/>
  <circle cx="256" cy="262" r="220" fill="url(#glow)"/>
  <!-- a d20: the hexagon outline, its facets, and the front face -->
  <g stroke="#8A4B12" stroke-width="10" stroke-linejoin="round">
    <path d="M256 84 L410 173 L410 351 L256 440 L102 351 L102 173 Z" fill="url(#gold)"/>
    <path d="M256 84 L256 150 M410 173 L370 340 M410 173 L256 150 M410 351 L370 340 M256 440 L370 340 M256 440 L142 340 M102 351 L142 340 M102 173 L142 340 M102 173 L256 150" fill="none"/>
    <path d="M256 150 L370 340 L142 340 Z" fill="url(#face)"/>
  </g>
  <!-- the L, for Larper, on the face that rolled up -->
  <path d="M236 228 V302 H286" fill="none" stroke="#8A4B12" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- a glint on the top edge -->
  <path d="M150 178 L238 128" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="9" stroke-linecap="round"/>
</svg>
