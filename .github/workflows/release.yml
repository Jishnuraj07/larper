name: Release

# Push a version tag (git tag v1.1.0 && git push origin v1.1.0) to build the
# Windows installers, have SignPath sign them, and open a draft GitHub release
# with the signed files. Review the draft, write the notes, then publish it.
#
# Signing needs, from the SignPath project (see .signpath/README.md):
#   secret   SIGNPATH_API_TOKEN
#   variable SIGNPATH_ORGANIZATION_ID
# Until those exist, the draft gets the unsigned installers instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        shell: bash
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - name: Package the unsigned installers
        run: npm run package:desktop -- --publish never
      - name: Collect them under their release names
        shell: bash
        run: |
          v="${GITHUB_REF_NAME#v}"
          mkdir unsigned
          cp "release/Larper Setup $v.exe" "unsigned/Larper-Setup-$v.exe"
          cp "release/Larper $v.exe" "unsigned/Larper-$v-portable.exe"
      - id: upload
        uses: actions/upload-artifact@v7
        with:
          name: unsigned
          path: unsigned/
          if-no-files-found: error

  sign-and-release:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID != ''
    runs-on: ubuntu-latest
    steps:
      # The release-signing policy needs a manual approval in SignPath; the job waits up to an hour for it.
      - uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: larper
          signing-policy-slug: release-signing
          artifact-configuration-slug: installers
          github-artifact-id: ${{ needs.build.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: signed
      - name: Draft the release with the signed files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd signed
          sha256sum -b *.exe > SHA256SUMS.txt
          {
            echo "Signed builds for ${GITHUB_REF_NAME}. Replace this with the release notes before publishing."
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft \
            --title "Larper ${GITHUB_REF_NAME#v}" --notes-file notes.md *.exe

  release-unsigned:
    needs: build
    if: vars.SIGNPATH_ORGANIZATION_ID == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: unsigned
          path: unsigned
      - name: Draft the release with the unsigned files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd unsigned
          sha256sum -b *.exe > SHA256SUMS.txt
          {
            echo "Unsigned builds for ${GITHUB_REF_NAME}: Windows SmartScreen will warn before running them. Replace this with the release notes before publishing."
            echo
            echo '## Checksums (SHA-256)'
            echo
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft             --title "Larper ${GITHUB_REF_NAME#v}" --notes-file notes.md *.exe SHA256SUMS.txt
