name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Built CLI starts
        run: node bin/larper.mjs --help
      - name: End-to-end smoke test
        run: npm run smoke:themes
      - name: Desktop app smoke test
        if: runner.os == 'Windows'
        run: npx electron . --smoke --shots=shots
      - name: Upload desktop screenshots
        if: runner.os == 'Windows' && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshots-node${{ matrix.node }}
          path: shots/
